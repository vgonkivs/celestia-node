name: Dependabot Go Mod Tidy (FORK TEST)

on:
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "**/go.mod"
      - "**/go.sum"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  tidy:
    name: Tidy all Go modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go mod tidy in every module
        run: |
          find . -name go.mod -not -path '*/vendor/*' -print0 | while IFS= read -r -d '' modfile; do
            dir=$(dirname "$modfile")
            echo "::group::go mod tidy in $dir"
            ( cd "$dir" && go mod tidy )
            echo "::endgroup::"
          done

      - name: Dry run — show what tidy would change
        run: |
          if git diff --quiet; then
            echo "all modules already tidy — nothing to do"
            exit 0
          fi
          echo "=== fixup, который был бы закоммичен ==="
          git --no-pager diff --stat
          git --no-pager diff
