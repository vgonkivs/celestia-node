name: Dependabot Go Mod Tidy (FORK TEST)

on:
  pull_request:
    paths:
      - "go.mod"
      - "go.sum"
      - "**/go.mod"
      - "**/go.sum"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  tidy:
    name: Tidy all Go modules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run go mod tidy in every module
        run: |
          find . -name go.mod -not -path '*/vendor/*' -print0 | while IFS= read -r -d '' modfile; do
            dir=$(dirname "$modfile")
            echo "::group::go mod tidy in $dir"
            ( cd "$dir" && go mod tidy )
            echo "::endgroup::"
          done

      - name: Commit and push fixup if anything changed
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then
            echo "all modules already tidy — nothing to do"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(deps): go mod tidy (fork-test auto-push)"
          git push origin "HEAD:$HEAD_REF"
